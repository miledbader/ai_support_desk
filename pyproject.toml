[project]
name = "ai-support-desk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "miledbader", email = "miledb2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.1",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-support-desk = "ai_support_desk:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
